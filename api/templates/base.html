<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SES S3 Mailbox{% endblock %}</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <nav>
        <a href="/dashboard">Dashboard</a>
        <a href="/dashboard/mailboxes/master">Master</a>
        <a href="/dashboard/mailboxes/wizard">Create mailbox</a>
        <a href="/dashboard/mailboxes/new">+ New (advanced)</a>
        <a href="/dashboard/operators">Operators</a>
        <a href="/dashboard/imap-sync">IMAP Sync</a>
        <a href="/dashboard/catch-all">Catch-all</a>
        <a href="/docs">API Docs</a>
        <span style="float: right; color: #ecf0f1;">
            {% if request.session.get("username") %}
                {{ request.session["username"] }}
                <form method="post" action="/auth/logout" style="display: inline;">
                    <button type="submit" style="background: none; border: none; color: #ecf0f1; cursor: pointer; text-decoration: underline;">[Logout]</button>
                </form>
            {% else %}
                <a href="/auth/login" style="color: #ecf0f1;">Login</a>
            {% endif %}
        </span>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
