{% extends "base.html" %}
{% block title %}Login — SES S3 Mailbox{% endblock %}
{% block content %}
<h1>Login</h1>
<form method="post" action="/auth/login">
    <div style="margin-bottom: 12px;">
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" required style="padding: 8px; width: 250px;">
    </div>
    <div style="margin-bottom: 12px;">
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required style="padding: 8px; width: 250px;">
    </div>
    {% if error %}
    <p style="color: #721c24; background: #f8d7da; padding: 8px; border-radius: 4px;">{{ error }}</p>
    {% endif %}
    <button type="submit" style="padding: 8px 20px; background: #2c3e50; color: #fff; border: none; border-radius: 4px; cursor: pointer;">Login</button>
</form>
{% endblock %}
