# Dovecot configuration — Docker alpha
# User database comes from /app/dovecot/users (generated by sync-imap-users)
# Maildir is shared with the API/worker containers via app_data volume.

protocols = imap
listen = *

mail_location = maildir:/app/data/maildir/%n

passdb {
  driver = passwd-file
  args = scheme=SHA512-CRYPT username_format=%u /app/dovecot/users
}

userdb {
  driver = passwd-file
  args = username_format=%u /app/dovecot/users
  override_fields = home=/app
}

ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login

first_valid_uid = 1000
last_valid_uid = 1000

namespace inbox {
  inbox = yes
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}
