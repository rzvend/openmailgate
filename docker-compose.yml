version: "3.8"

services:
  api:
    build: .
    env_file: .env
    command: python3 -m uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
      - iac_state:/app/state/iac
      - iac_setup_logs:/app/logs/setup
    restart: unless-stopped

  worker-sqs:
    build: .
    env_file: .env
    command: python3 -m worker.sqs_worker
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
    restart: unless-stopped

  smtp-sender:
    build: .
    env_file: .env
    command: python3 -m sender.smtp_server
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
    restart: unless-stopped

  # ── Dovecot / Postfix — planned for G.2 ──────────────────────────────
