version: "3.8"

services:
  api:
    build: .
    env_file: .env
    command: python3 -m uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
      - iac_state:/app/state/iac
      - iac_setup_logs:/app/logs/setup
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker-sqs:
    build: .
    env_file: .env
    command: python3 -m worker.sqs_worker
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
    restart: unless-stopped

  smtp-sender:
    build: .
    env_file: .env
    command: python3 -m sender.smtp_server
    ports:
      - "${SMTP_BIND:-127.0.0.1}:${SMTP_PORT:-2525}:2525"
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; socket.create_connection((\"127.0.0.1\",2525),timeout=3).close()'"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Dovecot / Postfix — planned for G.2.x ───────────────────────────
  #
  # These services require further configuration and testing before
  # they can be enabled in the default stack. See docs/deploy-docker.md.

  dovecot:
    image: dovecot/dovecot:2.3.21
    restart: unless-stopped
    ports:
      - "${IMAP_BIND:-127.0.0.1}:${IMAP_PORT:-143}:143"
    volumes:
      - app_data:/app/data:ro
      - ./docker/dovecot/dovecot.conf:/etc/dovecot/dovecot.conf:ro
      - dovecot_data:/app/dovecot
    healthcheck:
      test: ["CMD-SHELL", "dovecot service status 2>/dev/null || doveadm service status imap 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    cap_add:
      - SYS_PTRACE

volumes:
  app_data:
  app_logs:
  iac_state:
  iac_setup_logs:
  dovecot_data:
