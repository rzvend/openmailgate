<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup Administrator — SES S3 Mailbox</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <main>
        <h1>Create Administrator</h1>

        <p>No administrator has been created yet.</p>
        <p>Create the first administrator account to access the dashboard.</p>

        {% if error %}
        <p style="color: #721c24; background: #f8d7da; padding: 8px; border-radius: 4px;">{{ error }}</p>
        {% endif %}

        <form method="post" action="/setup">
            <div style="margin-bottom: 12px;">
                <label for="username">Username:</label><br>
                <input type="text" id="username" name="username" required
                       style="padding: 8px; width: 250px;"
                       autocomplete="username">
            </div>
            <div style="margin-bottom: 12px;">
                <label for="password">Password (min 8 characters):</label><br>
                <input type="password" id="password" name="password" required
                       style="padding: 8px; width: 250px;"
                       autocomplete="new-password">
            </div>
            <div style="margin-bottom: 12px;">
                <label for="confirm">Confirm password:</label><br>
                <input type="password" id="confirm" name="confirm" required
                       style="padding: 8px; width: 250px;"
                       autocomplete="new-password">
            </div>
            <button type="submit" style="padding: 8px 20px; background: #2c3e50; color: #fff; border: none; border-radius: 4px; cursor: pointer;">
                Create administrator
            </button>
        </form>

        <p style="margin-top: 24px; color: #666; font-size: 13px;">
            CLI alternative:
            <code>docker compose run --rm api python3 scripts/bootstrap_admin.py</code>
        </p>
    </main>
</body>
</html>
