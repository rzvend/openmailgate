{% extends "base.html" %}
{% block title %}New Operator — SES S3 Mailbox{% endblock %}
{% block content %}
<h1>New Operator</h1>

<form method="post" action="/dashboard/operators/new">
    <div style="margin-bottom: 12px;">
        <label for="username">Username:</label><br>
        <input type="text" id="username" name="username" required
               pattern="[a-z0-9_.-]+" title="Lowercase letters, numbers, dot, hyphen"
               style="padding: 8px; width: 300px;">
    </div>
    <div style="margin-bottom: 12px;">
        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required minlength="8" style="padding: 8px; width: 300px;">
    </div>
    <div style="margin-bottom: 12px;">
        <label for="confirm">Confirm password:</label><br>
        <input type="password" id="confirm" name="confirm" required minlength="8" style="padding: 8px; width: 300px;">
    </div>
    <div style="margin-bottom: 16px;">
        <label><input type="checkbox" name="active" value="1" checked> Active</label>
    </div>
    {% if error %}<p style="color: #721c24; background: #f8d7da; padding: 8px; border-radius: 4px;">{{ error }}</p>{% endif %}
    <button type="submit" style="padding: 8px 20px; background: #2c3e50; color: #fff; border: none; border-radius: 4px; cursor: pointer;">Create operator</button>
    <a href="/dashboard/operators" class="muted" style="margin-left: 12px;">Cancel</a>
</form>
{% endblock %}
